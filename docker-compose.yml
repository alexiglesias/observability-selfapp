services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: obs-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle # allows `curl -X POST :9090/-/reload` after editing rules, without a restart
    ports:
      - "9090:9090"
    networks:
      - obs-net
      - self-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: obs-alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager # silences and notification history survive restarts
    secrets:
      - slack_webhook # -> /run/secrets/slack_webhook, read via slack_api_url_file
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    networks:
      - obs-net

  grafana:
    image: grafana/grafana-oss:11.1.0
    container_name: obs-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - obs-net
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.1.0
    container_name: obs-loki
    restart: unless-stopped
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - obs-net

  # Collects container logs and ships them to Loki (replaces Promtail, EOL
  # since March 2026). Pipeline UI: http://localhost:12345
  alloy:
    image: grafana/alloy:v1.21.2
    container_name: obs-alloy
    restart: unless-stopped
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data # remembers how far it has read each log
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    networks:
      - obs-net
    depends_on:
      - loki

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: obs-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    ports:
      - "9100:9100"
    networks:
      - obs-net
    # NOTE: on Docker Desktop (macOS/Windows), node-exporter reports
    # metrics for the lightweight Linux VM Docker Desktop runs inside,
    # not your actual laptop hardware. On native Linux it reports the
    # real host. Either way it's real metrics from something, just be
    # aware of which "host" you're actually looking at.

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: obs-cadvisor
    restart: unless-stopped
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8085:8080" # host 8085, since selfweb already uses host port 80 and cAdvisor's own default (8080) is a common collision point with other local tooling
    networks:
      - obs-net
    # Per-container CPU/memory/network for every container, with no changes
    # to the images. Request counts and errors come from the app itself
    # (the selfapp job in prometheus/prometheus.yml).

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
  alertmanager-data:

# The Slack webhook URL, taken from SLACK_WEBHOOK_URL in .env and mounted as a
# file inside the alertmanager container. It never appears in a tracked file
# or in the container's environment variables.
secrets:
  slack_webhook:
    environment: SLACK_WEBHOOK_URL

networks:
  obs-net:
    driver: bridge
  # docker-buildlab-selfapp's network. Compose prefixes network names with
  # the project (folder) name, so its "self-net" really exists as
  # "docker-buildlab-selfapp_self-net". Override with SELFAPP_NETWORK in .env
  # if you cloned that repo into a folder with another name.
  # Start that stack first: scripts/up.sh checks the network exists.
  self-net:
    external: true
    name: ${SELFAPP_NETWORK:-docker-buildlab-selfapp_self-net}
