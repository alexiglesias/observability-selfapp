services:
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: obs-prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - ./prometheus:/etc/prometheus:ro # whole folder, so edits and git switches are seen by /-/reload
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle # allows `curl -X POST :9090/-/reload` after editing rules, without a restart
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - obs-net
      - self-net

  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: obs-alertmanager
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager # silences and notification history survive restarts
    secrets:
      - slack_webhook # -> /run/secrets/slack_webhook, read via slack_api_url_file
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    networks:
      - obs-net

  grafana:
    image: grafana/grafana:13.2.4
    container_name: obs-grafana
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - obs-net
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started

  loki:
    image: grafana/loki:3.7.9
    container_name: obs-loki
    restart: unless-stopped
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - obs-net

  # Collects container logs and ships them to Loki (replaces Promtail, EOL
  # since March 2026). Pipeline UI: http://localhost:12345
  alloy:
    image: grafana/alloy:v1.21.2
    container_name: obs-alloy
    restart: unless-stopped
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data # remembers how far it has read each log
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "127.0.0.1:12345:12345"
    networks:
      - obs-net
    depends_on:
      - loki

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: obs-node-exporter
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9100/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    networks:
      - obs-net
    # NOTE: on Docker Desktop (macOS/Windows), node-exporter reports
    # metrics for the lightweight Linux VM Docker Desktop runs inside,
    # not your actual laptop hardware. On native Linux it reports the
    # real host. Either way it's real metrics from something, just be
    # aware of which "host" you're actually looking at.

  cadvisor:
    image: ghcr.io/google/cadvisor:0.60.6
    container_name: obs-cadvisor
    restart: unless-stopped
    privileged: true # as cAdvisor's docs recommend: full access to the host's cgroups
    devices:
      - /dev/kmsg # kernel messages, used for out-of-memory (OOM) events
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro # Docker API: container names and labels
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro # containerd API: needed when Docker uses the containerd image store
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "127.0.0.1:8085:8080" # cAdvisor UI; 8080 inside, 8085 on the Mac 
    networks:
      - obs-net
    # Per-container CPU/memory/network for every container, with no changes
    # to the images. Request counts and errors come from the app itself
    # (the selfapp job in prometheus/prometheus.yml).

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
  alertmanager-data:

# The Slack webhook URL, taken from SLACK_WEBHOOK_URL in .env and mounted as a
# file inside the alertmanager container. It never appears in a tracked file
# or in the container's environment variables.
secrets:
  slack_webhook:
    environment: SLACK_WEBHOOK_URL

networks:
  obs-net:
    driver: bridge
  # docker-buildlab-selfapp's network. Compose prefixes network names with
  # the project (folder) name, so its "self-net" really exists as
  # "docker-buildlab-selfapp_self-net". Override with SELFAPP_NETWORK in .env
  # if you cloned that repo into a folder with another name.
  # Start that stack first: scripts/up.sh checks the network exists.
  self-net:
    external: true
    name: ${SELFAPP_NETWORK:-docker-buildlab-selfapp_self-net}
