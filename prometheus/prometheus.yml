global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - obs-alertmanager:9093

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node-exporter
    static_configs:
      - targets: ["obs-node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["obs-cadvisor:8080"] # container-internal port, not the remapped 8085 host port

  # selfapp's own metrics (requests, latency, JVM, database pool), published
  # by Spring Boot Actuator + Micrometer. Reachable only inside the Docker
  # network: nginx returns 404 for /actuator/prometheus on port 80.
  - job_name: selfapp
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["selfapp:8080"]
